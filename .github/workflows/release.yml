name: Release

# Tag push builds and drafts a GitHub release; manual runs just build and keep
# the bundles as artifacts, which is how you verify the three platforms without
# cutting a version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.display }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            display: macOS (universal)
            args: --target universal-apple-darwin
            installers: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            name: linux
            display: Linux (x86_64)
            args: ""
            installers: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            name: windows
            display: Windows (x86_64)
            args: ""
            installers: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - uses: actions/checkout@v5

      # WebKitGTK is the webview Tauri renders into; libssl is for native-tls.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libssl-dev build-essential file

      # russh pulls aws-lc-sys, whose assembly needs NASM on Windows.
      - name: NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: macOS cross targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Tauri treats an empty APPLE_CERTIFICATE as "sign with this", so the
      # variables are only exported once a real certificate is configured.
      # Until then the macOS bundle is simply unsigned.
      - name: Apple signing credentials
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "No APPLE_CERTIFICATE secret: the macOS bundle will be unsigned."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=$CERT"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$NOTARY_ID" ]; then
            {
              echo "APPLE_ID=$NOTARY_ID"
              echo "APPLE_PASSWORD=$NOTARY_PASSWORD"
              echo "APPLE_TEAM_ID=$NOTARY_TEAM"
            } >> "$GITHUB_ENV"
            echo "Signing and notarizing."
          else
            echo "Signing without notarization (no APPLE_ID secret)."
          fi

      - name: Build bundles
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts; the matching public key is in
          # tauri.conf.json, and the app refuses an update signed by anything else.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 5db ${{ github.ref_name }}
          releaseBody: |
            Instaladores para macOS (universal), Windows e Linux.

            O macOS ainda não é assinado nem notarizado: na primeira abertura use
            botão direito → Abrir, ou `xattr -dr com.apple.quarantine /Applications/5db.app`.
          releaseDraft: true
          prerelease: false

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: 5db-${{ matrix.name }}
          path: ${{ matrix.installers }}
          if-no-files-found: error
          retention-days: 7
