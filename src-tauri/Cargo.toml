[package]
name = "fivedb"
version = "0.1.0"
description = "5db — a modern Postgres and Redis client"
authors = ["Leve"]
license = "MIT"
repository = "https://github.com/5ucr4m/5db"
edition = "2024"
default-run = "fivedb"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fivedb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4"] }
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager", "aio", "tokio-native-tls-comp"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
futures-util = "0.3.34"
shell-words = "1.1.1"
dirs = "7.0.0"
axum = { version = "0.8.9", optional = true }
tower-http = { version = "0.7.1", features = ["cors"], optional = true }
tauri-plugin-dialog = "2.8.3"
russh = "0.65.0"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keyring = "4.2.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[features]
devserver = ["dep:axum", "dep:tower-http"]

[[bin]]
name = "fivedb"
path = "src/main.rs"

[[bin]]
name = "devserver"
path = "src/bin/devserver.rs"
required-features = ["devserver"]
